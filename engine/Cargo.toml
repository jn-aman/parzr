[package]
name = "parzr-engine"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "parzr_engine"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "parzr-engine"
path = "src/main.rs"

[dependencies]
harper-core = { version = "=1.7.0", default-features = false, features = ["concurrent"], optional = true }
regex = "1.11"
aho-corasick = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "2.7", features = ["unicode"] }

[profile.release]
lto = "thin"
strip = "debuginfo"

[[bin]]
name = "parzr-native-host"
path = "src/native_host.rs"

[[bin]]
name = "parzr-export-lexicon"
path = "src/export_lexicon.rs"
required-features = ["baseline-harper"]

[[bin]]
name = "parzr-lsp"
path = "src/lsp.rs"

[features]
default = ["local-model"]
local-model = []
baseline-harper = ["dep:harper-core"]
