name: Deploy parzr.app
# Deploys website/ to Cloudflare Workers static assets. It runs:
#   - after every published, verified app release: the `website` job of ci-release.yml starts it on main, so the
#     site's download links never point ahead of releases/latest;
#   - on demand (Actions, Deploy parzr.app, Run workflow on main, or `gh workflow run website.yml --ref main`)
#     for website-only changes between releases.
# Pushes to main no longer deploy by themselves (docs/releases.md, "Website").
# CLOUDFLARE_API_TOKEN (Workers edit on the account, scoped to parzr.app) is a secret of the website-production
# environment, which only main may deploy to; CLOUDFLARE_ACCOUNT_ID is a repository variable. Without them the job
# skips with a notice. Only the deploy step sees the token.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: parzr-website
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: website-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check deployment credentials
        id: creds
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != true ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Set the CLOUDFLARE_API_TOKEN secret (website-production environment) and CLOUDFLARE_ACCOUNT_ID variable to enable website deploys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.creds.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: '22.23.3'
      - name: Install the pinned wrangler
        # website/package-lock.json pins wrangler and every dependency with integrity hashes; no install scripts run.
        if: steps.creds.outputs.ready == 'true'
        working-directory: website
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./node_modules/.bin/wrangler deploy
