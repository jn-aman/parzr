name: Verify and release Parzr
# Full verification runs on pull requests, pushes to main, version tags (cut by the Release workflow)
# and on demand; docs and website changes never need a Mac runner (path filters do not apply to tags).
# Pull requests always start, so the required `verify` check always reports: a docs-only one skips it,
# and GitHub counts a skipped required check as passed.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['website/**', 'docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      critical:
        description: Mark the update critical (installed promptly, cannot be skipped, no phased rollout)
        type: boolean
        default: false
      notes:
        description: 'Optional update notes shown in the app (separate bullets with " | "); defaults to the commit subjects since the last tag'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: parzr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ] || [ -n "$(git diff --name-only "$BASE" HEAD | grep -vE '^(website/|docs/)|\.md$')" ]; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi
  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.91.0'
          components: rustfmt, clippy
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Version and Rust checks
        run: |
          python3 scripts/audit-public-repo.py
          python3 scripts/check-release-version.py
          cargo fmt --manifest-path engine/Cargo.toml --check
          cargo clippy --locked --manifest-path engine/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path engine/Cargo.toml
          cargo test --locked --manifest-path engine/Cargo.toml --no-default-features
      - name: Build engine and test native bridge
        run: |
          python3 scripts/prepare-model.py
          cargo build --release --locked --manifest-path engine/Cargo.toml
          PARZR_MODEL_PATH="$PWD/dist/model/Qwen3.5-0.8B-Q5_K_M.gguf" PARZR_MODEL_RUNTIME="$PWD/dist/model/libparzr_model.dylib" python3 scripts/run-name-benchmark.py
          PARZR_MODEL_PATH="$PWD/dist/model/Qwen3.5-0.8B-Q5_K_M.gguf" PARZR_MODEL_RUNTIME="$PWD/dist/model/libparzr_model.dylib" PARZR_ENGINE_PATH="$PWD/engine/target/release/libparzr_engine.dylib" swift test --package-path mac
      - name: Everyday-error quality gate
        # The held-out test split (benchmarks/heldout, never used for tuning) through the app's own path. Fails when
        # what runs while typing fixes less, or changes more correct text, than the last measured build allows.
        run: |
          swiftc -O -parse-as-library mac/Sources/ParzrCore/Models.swift mac/Sources/ParzrCore/WritingEngine.swift scripts/heldout-native.swift -o dist/qa/heldout-native
          PARZR_ENGINE_PATH="$PWD/engine/target/release/libparzr_engine.dylib" PARZR_MODEL_PATH="$PWD/dist/model/Qwen3.5-0.8B-Q5_K_M.gguf" PARZR_MODEL_RUNTIME="$PWD/dist/model/libparzr_model.dylib" \
            python3 scripts/run-heldout-benchmark.py --engine dist/qa/heldout-native --split test --layers rules,gec --output dist/qa/heldout \
            --min-fix-rate rules=0.43 --min-fix-rate gec=0.62 --max-false-alarm-rate rules=0.02 --max-false-alarm-rate gec=0.02
      - name: Keystroke-typo quality gate
        # benchmarks/typo-fuzz test set: every keystroke slip type on 200 sentences written after the fixes.
        run: |
          PARZR_ENGINE_PATH="$PWD/engine/target/release/libparzr_engine.dylib" PARZR_MODEL_PATH="$PWD/dist/model/Qwen3.5-0.8B-Q5_K_M.gguf" PARZR_MODEL_RUNTIME="$PWD/dist/model/libparzr_model.dylib" \
            python3 scripts/run-heldout-benchmark.py --engine dist/qa/heldout-native --corpus benchmarks/typo-fuzz/test.jsonl --clean benchmarks/typo-fuzz/test-clean.jsonl \
            --split all --layers rules,gec --output dist/qa/typo-fuzz \
            --min-fix-rate rules=0.78 --min-fix-rate gec=0.80 --max-false-alarm-rate rules=0.03 --max-false-alarm-rate gec=0.03
      - name: Browser and editor integration checks
        run: |
          npm ci
          npx playwright install chromium
          PARZR_MODEL_PATH="$PWD/dist/model/Qwen3.5-0.8B-Q5_K_M.gguf" PARZR_MODEL_RUNTIME="$PWD/dist/model/libparzr_model.dylib" npm run test:editors
          PARZR_MODEL_PATH="$PWD/dist/model/Qwen3.5-0.8B-Q5_K_M.gguf" PARZR_MODEL_RUNTIME="$PWD/dist/model/libparzr_model.dylib" npm run test:browser
      - name: Package the optional extensions
        run: python3 scripts/package-extensions.py
      - name: Build and package local development DMG
        run: |
          python3 scripts/build.py
          dist/Parzr.app/Contents/MacOS/parzr --health-check
          python3 scripts/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        # The audit upload is a record, not a check: a GitHub artifact outage must not block a release.
        continue-on-error: true
        with:
          name: verification-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/qa/browser-results.json
            dist/qa/heldout/summary.md
            dist/qa/heldout/summary.json
            dist/build-report.json
            dist/package-report.json
            dist/extensions/parzr-*
            dist/Parzr-*-local.dmg
  release:
    # Publishing is owner-only: the owner's tag push, or the Release workflow's dispatch (github-actions[bot]).
    if: startsWith(github.ref, 'refs/tags/v') && (github.triggering_actor == github.repository_owner || github.triggering_actor == 'github-actions[bot]')
    needs: verify
    runs-on: macos-26
    timeout-minutes: 75
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.91.0'
      - name: Validate release version
        run: python3 scripts/check-release-version.py
      - name: Prepare ephemeral signing keychain
        env:
          PARZR_CERTIFICATE_BASE64: ${{ secrets.PARZR_CERTIFICATE_BASE64 }}
          PARZR_CERTIFICATE_PASSWORD: ${{ secrets.PARZR_CERTIFICATE_PASSWORD }}
          PARZR_SIGNING_IDENTITY: ${{ secrets.PARZR_SIGNING_IDENTITY }}
          PARZR_NOTARY_KEY_BASE64: ${{ secrets.PARZR_NOTARY_KEY_BASE64 }}
          PARZR_NOTARY_KEY_ID: ${{ secrets.PARZR_NOTARY_KEY_ID }}
          PARZR_NOTARY_ISSUER: ${{ secrets.PARZR_NOTARY_ISSUER }}
        run: python3 scripts/ci-signing.py
      - name: Build Apple Silicon app, sign, notarize, staple and verify
        env:
          PARZR_SIGNING_IDENTITY: ${{ secrets.PARZR_SIGNING_IDENTITY }}
          PARZR_BUNDLE_ID: ${{ vars.PARZR_BUNDLE_ID || 'app.parzr.desktop' }}
        run: |
          python3 scripts/build.py --sign
          dist/Parzr.app/Contents/MacOS/parzr --health-check
          python3 scripts/package.py --release
      - name: Checksum verified distribution
        run: |
          cd dist
          shasum -a 256 Parzr-*.dmg > SHA256SUMS
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Package the optional extensions
        # parzr-vscode-X.Y.Z.vsix and parzr-browser-extension-X.Y.Z.zip from the tagged sources (versions were
        # checked against the app above), added to SHA256SUMS. Lower-case names keep them out of the Parzr-*.zip update globs.
        run: |
          python3 scripts/package-extensions.py
          (cd dist/extensions && shasum -a 256 parzr-* >> ../SHA256SUMS)
      - name: Fixed-name copies for direct download links
        # releases/latest/download/<name> always serves the newest release, so the website, README and docs link
        # straight to the file. dist/latest stays outside the Parzr-*.dmg and parzr-* globs; cp -c clones on APFS.
        run: |
          mkdir -p dist/latest
          cp -c dist/Parzr-*.dmg dist/latest/Parzr.dmg
          cp -c dist/extensions/parzr-vscode-*.vsix dist/latest/parzr-vscode.vsix
          cp -c dist/extensions/parzr-browser-extension-*.zip dist/latest/parzr-browser-extension.zip
          (cd dist/latest && shasum -a 256 Parzr.dmg parzr-vscode.vsix parzr-browser-extension.zip >> ../SHA256SUMS)
      - name: Fetch previous update zips for delta updates
        # Up to 3 earlier releases that carry an update zip; releases without one (0.2.x) are skipped.
        env:
          GH_TOKEN: ${{ github.token }}
          PARZR_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist/prev-zips
          n=0
          for t in $(gh release list --limit 15 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName'); do
            [ "$t" = "$PARZR_RELEASE_TAG" ] && continue
            if gh release download "$t" --pattern 'Parzr-*.zip' --dir dist/prev-zips; then n=$((n + 1)); else echo "$t has no update zip, skipping"; fi
            [ "$n" -ge 3 ] && break
          done
          echo "Fetched $n previous update zip(s)"
      - name: Build, sign and verify the update feed
        # Writes dist/update/{Parzr-X.Y.Z.zip,*.delta,appcast.xml} and fails unless every signature,
        # length and delta checks out. The EdDSA key reaches the script on stdin, never a file or a log.
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          PARZR_RELEASE_TAG: ${{ github.ref_name }}
          PARZR_CRITICAL: ${{ inputs.critical }}
          PARZR_NOTES: ${{ inputs.notes }}
        run: |
          args=(--app dist/Parzr.app --version "${PARZR_RELEASE_TAG#v}" --out dist/update --prev-dir dist/prev-zips --notes "$PARZR_NOTES")
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${PARZR_RELEASE_TAG}^" 2>/dev/null || true)
          [ -n "$prev" ] && args+=(--git-range "$prev..$PARZR_RELEASE_TAG")
          [ "$PARZR_CRITICAL" = "true" ] && args+=(--critical)
          python3 scripts/make-appcast.py build "${args[@]}"
      - name: Write release notes
        # What's new from the commit subjects (internal areas such as CI and Tests folded away), the Highlights
        # from the notes input, then downloads, install and update steps and the checksums.
        env:
          PARZR_RELEASE_TAG: ${{ github.ref_name }}
          PARZR_CRITICAL: ${{ inputs.critical }}
          PARZR_NOTES: ${{ inputs.notes }}
        run: |
          args=(--version "${PARZR_RELEASE_TAG#v}" --notes "$PARZR_NOTES" --dist dist --out dist/release-notes.md)
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${PARZR_RELEASE_TAG}^" 2>/dev/null || true)
          [ -n "$prev" ] && args+=(--git-range "$prev..$PARZR_RELEASE_TAG")
          [ "$PARZR_CRITICAL" = "true" ] && args+=(--critical)
          python3 scripts/release_notes.py "${args[@]}"
          cat dist/release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          PARZR_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Required assets must exist; deltas are optional (the first updater release has none to diff against).
          shopt -s nullglob
          required=(dist/Parzr-*.dmg dist/latest/* dist/SHA256SUMS dist/extensions/parzr-* LICENSE THIRD_PARTY_NOTICES dist/update/Parzr-*.zip dist/update/appcast.xml)
          for pattern in 'dist/Parzr-*.dmg' 'dist/latest/Parzr.dmg' 'dist/latest/parzr-vscode.vsix' 'dist/latest/parzr-browser-extension.zip' 'dist/extensions/parzr-*.vsix' 'dist/extensions/parzr-*.zip' 'dist/update/Parzr-*.zip' 'dist/update/appcast.xml'; do
            matches=($pattern)
            if [ ${#matches[@]} -eq 0 ]; then echo "::error::missing release asset $pattern"; exit 1; fi
          done
          deltas=(dist/update/*.delta)
          echo "Publishing ${#required[@]} assets and ${#deltas[@]} deltas"
          gh release create "$PARZR_RELEASE_TAG" --verify-tag --title "Parzr $PARZR_RELEASE_TAG" --notes-file dist/release-notes.md "${required[@]}" "${deltas[@]}"
      - name: Verify the published update feed
        # The feed is live the moment the release is. Re-check what users will download; if it is bad,
        # draft the release so the feed (releases/latest) falls back to the previous release.
        env:
          GH_TOKEN: ${{ github.token }}
          PARZR_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases"
          verify() {
            python3 scripts/make-appcast.py verify --appcast "$base/download/$PARZR_RELEASE_TAG/appcast.xml" --version "${PARZR_RELEASE_TAG#v}" || return 1
            curl -fsSL "$base/download/$PARZR_RELEASE_TAG/appcast.xml" -o "$RUNNER_TEMP/tag-appcast.xml" || return 1
            for _ in 1 2 3 4 5 6; do
              curl -fsSL "$base/latest/download/appcast.xml" -o "$RUNNER_TEMP/latest-appcast.xml" && cmp "$RUNNER_TEMP/tag-appcast.xml" "$RUNNER_TEMP/latest-appcast.xml" && break
              sleep 10
            done
            cmp -s "$RUNNER_TEMP/tag-appcast.xml" "$RUNNER_TEMP/latest-appcast.xml" || return 1
            # The website's Download buttons: one byte of each fixed-name file through releases/latest.
            for f in Parzr.dmg parzr-vscode.vsix parzr-browser-extension.zip; do
              curl -fsSL -r 0-0 -o /dev/null "$base/latest/download/$f" || { echo "::error::$f is not reachable through releases/latest"; return 1; }
            done
          }
          if ! verify; then
            echo "::error::Published update feed failed verification; drafting the release so updates fall back to the previous release."
            gh release edit "$PARZR_RELEASE_TAG" --draft
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        # The audit upload is a record, not a check: a GitHub artifact outage must not block a release.
        continue-on-error: true
        with:
          name: release-audit-${{ github.sha }}
          path: |
            dist/build-report.json
            dist/package-report.json
            dist/app-notarization.json
            dist/dmg-notarization.json
            dist/update/appcast.xml
            dist/release-notes.md
      - name: Remove ephemeral signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/parzr-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/parzr-signing.p12" "$RUNNER_TEMP/parzr-notary.p8"
