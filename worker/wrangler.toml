# Parzr suggestion reports Worker; see worker/README.md.
name = "parzr-reports"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# Served only on the custom domain the app's Info.plist names (ParzrReportsURL).
workers_dev = false
preview_urls = false
routes = [{ pattern = "reports.parzr.app", custom_domain = true }]

# No Workers Logs or traces: invocation logs would carry request metadata the Worker itself never stores.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "parzr-reports"
database_id = "01da2683-fd5d-4948-8850-05750a027744"
migrations_dir = "migrations"

# Per-client request limit: 4 requests a minute, keyed by a salted, daily hash of the IPv4 address or IPv6 /64
# (nothing is stored). With at most 25 reports a request, one network can add 100 rows a minute; DAILY_ROW_CAP bounds
# the total.
[[ratelimits]]
name = "REPORTS_LIMITER"
namespace_id = "4201"
simple = { limit = 4, period = 60 }

# The deployed version id, which /v1/health returns so a deploy can check it is the one answering.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Validation is a handful of bounded regular expressions per field; anything slower is cut off.
[limits]
cpu_ms = 50

# Daily retention clean-up.
[triggers]
crons = ["17 3 * * *"]

[vars]
RETENTION_DAYS = "180"
# Report rows stored per UTC day across every client; past it the Worker answers 503 until midnight UTC.
DAILY_ROW_CAP = "20000"

# Secret, set with: npx wrangler secret put RATE_LIMIT_SALT
# RATE_LIMIT_SALT = "..."
